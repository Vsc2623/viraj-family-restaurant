---
name: Restaurant Application CI

on:
  push:
    branches:
      - feature/ci-pipeline

permissions:
  contents: read

jobs:
  backend:
    name: Backend CI - ${{ matrix.service }}
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: foodhub
          POSTGRES_PASSWORD: foodhub_local_change_me
          POSTGRES_DB: postgres
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U foodhub -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: catalog-service
            database: catalog_db
          - service: order-service
            database: order_db
          - service: payment-service
            database: payment_db

    env:
      SPRING_DATASOURCE_URL: >-
        jdbc:postgresql://localhost:5432/${{ matrix.database }}
      SPRING_DATASOURCE_USERNAME: foodhub
      SPRING_DATASOURCE_PASSWORD: foodhub_local_change_me
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Initialize application databases
        run: |
          PGPASSWORD=foodhub_local_change_me psql \
            -h localhost -U foodhub -d postgres \
            -f database/init/01-databases.sql

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Java and Maven
        run: |
          java -version
          mvn --version

      - name: Build and test backend
        working-directory: services/${{ matrix.service }}
        run: mvn -B clean verify

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npx vite build
