name: Restaurant Application CI

on:
  push:
    branches:
      - feature/ci-pipeline

permissions:
  contents: read

jobs:
  backend:
    name: Backend CI - ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - catalog-service
          - order-service
          - payment-service

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Java and Maven
        run: |
          java -version
          mvn --version

      - name: Build and test backend
        working-directory: services/${{ matrix.service }}
        run: mvn -B clean verify

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npx vite build
