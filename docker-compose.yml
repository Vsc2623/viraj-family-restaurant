services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-foodhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foodhub_local_change_me}
      POSTGRES_DB: postgres
    ports: ["5433:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  catalog-service:
    build: ./services/catalog-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/catalog_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-foodhub}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-foodhub_local_change_me}
      SERVER_PORT: 8081
    ports: ["8084:8081"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  order-service:
    build: ./services/order-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/order_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-foodhub}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-foodhub_local_change_me}
      SERVER_PORT: 8082
      CATALOG_SERVICE_URL: http://catalog-service:8081
    ports: ["8085:8082"]
    depends_on:
      postgres:
        condition: service_healthy
      catalog-service:
        condition: service_started
    restart: unless-stopped

  payment-service:
    build: ./services/payment-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payment_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-foodhub}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-foodhub_local_change_me}
      SERVER_PORT: 8083
    ports: ["8086:8083"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports: ["5174:5173"]
    depends_on:
      - catalog-service
      - order-service
      - payment-service
    restart: unless-stopped

volumes:
  postgres-data:
